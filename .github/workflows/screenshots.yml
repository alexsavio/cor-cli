name: Update Screenshots

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  screenshots:
    name: Generate Screenshots
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: cargo-${{ runner.os }}

      - name: Install termshot
        run: |
          curl --silent --location \
            "https://raw.githubusercontent.com/homeport/termshot/main/hack/download.sh" \
            | bash

      - name: Build release binary
        run: cargo build --release

      - name: Generate screenshots
        run: bash scripts/demo-screenshots.sh

      - name: Commit updated screenshots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff --quiet assets/demo/ && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add assets/demo/
          git commit -m "chore: update demo screenshots [skip ci]"
          git pull --rebase
          git push
